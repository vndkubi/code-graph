name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Architecture gate
        run: npm run architecture-gate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Index benchmark smoke
        run: node dist/cli.js benchmark index --root . --parse-workers 2

      - name: Super VIP quality gate
        run: |
          node -e "require('node:fs').mkdirSync('.tmp/quality-gate', { recursive: true })"
          node dist/cli.js upgrade-audit --root . --require-ready --require-fresh --min-grade A --min-score 96 --max-slow-ms 5000 --json > .tmp/quality-gate/upgrade-audit.json

      - name: Upload quality gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-report
          path: .tmp/quality-gate/upgrade-audit.json

      - name: Codex E2E dry-run smoke
        run: node dist/cli.js benchmark codex-e2e --root . --suite examples/codegraph-self-e2e-quality-suite.example.json --dry-run --parse-workers 2
