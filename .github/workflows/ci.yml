name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Index benchmark smoke
        run: node dist/cli.js benchmark index --root . --parse-workers 2

      - name: Codex E2E dry-run smoke
        run: node dist/cli.js benchmark codex-e2e --root . --suite examples/codegraph-self-e2e-quality-suite.example.json --dry-run --parse-workers 2
